services:
  db:
    image: pgrouting/pgrouting:16-3.5-4.0
    environment:
      POSTGRES_DB: ruteo
      POSTGRES_USER: ruteo
      POSTGRES_PASSWORD: ruteo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "./00 - DB/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruteo -d ruteo"]
      interval: 3s
      retries: 20

  infraestructura:
    build: "./01 - Infraestructura"
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
    volumes:
      - "./01 - Infraestructura/salida:/app/salida"

  metadata:
    build: "./02 - Metadata"
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - MAPILLARY_TOKEN # opcional: si no está definido en el host se usa el del script
    volumes:
      - "./02 - Metadata/salida:/app/salida"

  amenazas:
    build: "./03 - Amenazas"
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - TOMTOM_API_KEY
    volumes:
      - "./03 - Amenazas/salidas:/app/salidas"

  web:
    build: "./04 - Web"
    ports:
      - "8080:80"
    volumes:
      - "./04 - Web:/usr/share/nginx/html:ro"
    depends_on:
      db:
        condition: service_healthy

  # Explorador de la base de datos: http://localhost:5050 (sin login, servidor ya registrado).
  # Para ver geometrías sobre un mapa: ejecutar una consulta con una columna geom y abrir el
  # "Geometry Viewer" en el panel de resultados.
  pgadmin:
    image: dpage/pgadmin4:8.14
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ruteo.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # pgAdmin exige un pgpass con permisos 0600, que no se pueden fijar en un volumen de Windows:
    # se crea dentro del contenedor al arrancar (credenciales de desarrollo, las mismas del servicio db).
    entrypoint:
      - /bin/sh
      - -c
      - echo 'db:5432:ruteo:ruteo:ruteo' > /tmp/pgpass && chmod 600 /tmp/pgpass && exec /entrypoint.sh
    volumes:
      - "./00 - DB/pgadmin-servers.json:/pgadmin4/servers.json:ro"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
